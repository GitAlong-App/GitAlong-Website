<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Theme before first paint: saved choice, else the OS setting (no flash). -->
    <script>
      (function () {
        var dark = false;
        try {
          var pref = localStorage.getItem('gitalong:theme');
          dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        } catch (e) {
          try { dark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e2) {}
        }
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>

    <!-- SEO -->
    <title>GitAlong – Find the developer your project is missing</title>
    <meta name="description" content="Say what you're building and who you need — a co-founder, contributors, a hackathon team or a mentor. GitAlong matches you on real GitHub work and tells you why." />
    <meta name="keywords" content="find a co-founder, technical co-founder, side project partner, open source contributors, hackathon team, developer mentor, find a mentor, developer collaboration, GitHub, collaborator matching" />
    <meta name="author" content="Sreevallabh Kakarala" />

    <!-- Open Graph -->
    <meta property="og:title" content="GitAlong – Find the developer your project is missing" />
    <meta property="og:description" content="Say what you're building and who you need. GitAlong matches you on real GitHub work and tells you why." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gitalong.vercel.app" />
    <meta property="og:image" content="https://gitalong.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Octo, GitAlong's octopus mascot, next to the promise: find the developer your project is missing." />
    <meta property="og:site_name" content="GitAlong" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GitAlong – Find the developer your project is missing" />
    <meta name="twitter:description" content="Co-founders, contributors, hackathon teammates and mentors — matched on intent and real GitHub work." />
    <meta name="twitter:image" content="https://gitalong.vercel.app/og-image.jpg" />

    <!-- Icons (Octo, generated from public/illustrations/octopus.png) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Fonts: Nunito (UI) and JetBrains Mono (code), both SIL OFL -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" />
    <link rel="dns-prefetch" href="https://api.github.com" />
    <link rel="dns-prefetch" href="https://avatars.githubusercontent.com" />
    <link rel="preload" as="image" href="/illustrations/octopus.png" type="image/png" />

    <meta name="theme-color" content="#16A34A" />
    <!-- Security headers (X-Frame-Options, nosniff, …) are sent by Vercel; see vercel.json. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 24px; text-align: center">
        GitAlong needs JavaScript to run. Please enable it and reload the page.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
